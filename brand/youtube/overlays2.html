<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Fragment+Mono&family=Hanken+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Extra overlay plates for the 10-minute Marsa Breakdown — 1920×1080, transparent.
   Gold gradient text = Sam n Harv brand identity (site/cards/signatures). */
html,body{margin:0;padding:0;background:transparent}
:root{--plaster:#efe8da;--bronze-bright:#c9ab7c}
.page{position:relative;width:1920px;height:1080px;overflow:hidden}
.display{font-family:'Libre Caslon Display',serif;font-weight:400;letter-spacing:-.01em}
.it{font-family:'Libre Caslon Text',serif;font-style:italic}
.annot{font-family:'Fragment Mono',monospace;letter-spacing:.16em;text-transform:uppercase}
.gold{background:linear-gradient(100deg,#b8965c 0%,#f3e3b4 38%,#e2c389 58%,#a98a52 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
.hair{height:2px;background:linear-gradient(90deg,rgba(169,138,82,0) 0%,#c4a676 25%,#ead8ab 50%,#c4a676 75%,rgba(169,138,82,0) 100%)}
.plate{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);width:1100px;text-align:center}
.shadow{text-shadow:0 2px 16px rgba(0,0,0,.6)}
.lede{font-size:30px;color:var(--plaster)}
</style></head><body>

<!-- 10 · THE DISCREPANCY -->
<div class="page"><div class="plate">
  <div style="display:flex;justify-content:center;align-items:baseline;gap:60px">
    <div class="display shadow" style="font-size:96px;color:var(--plaster);opacity:.55;text-decoration:line-through;text-decoration-thickness:3px">18,000</div>
    <div class="it shadow" style="font-size:40px;color:var(--plaster)">vs</div>
    <div class="display gold" style="font-size:112px">58,000</div>
  </div>
  <div class="hair" style="margin:24px auto 20px;width:720px"></div>
  <div class="annot lede shadow">residents &middot; the broker video vs Aldar&rsquo;s launch material</div>
</div></div>

<!-- 11 · SAADIYAT GROWTH -->
<div class="page"><div class="plate">
  <div class="display gold" style="font-size:112px;line-height:1">+86% in five years</div>
  <div class="hair" style="margin:26px auto 20px;width:720px"></div>
  <div class="annot lede shadow">Saadiyat apartments &middot; &asymp;AED 1,500 &rarr; 2,800 per sq ft &middot; 2020&ndash;2025</div>
  <div class="annot shadow" style="font-size:21px;margin-top:14px;color:var(--bronze-bright)">Source: Bayut Abu Dhabi Sales Report 2025 &middot; District Real Estate</div>
</div></div>

<!-- 12 · THE YIELD TRUTH -->
<div class="page"><div class="plate">
  <div class="display gold" style="font-size:104px;line-height:1.02">Yields: 4.5&ndash;5.5%</div>
  <div class="hair" style="margin:26px auto 20px;width:720px"></div>
  <div class="annot lede shadow">A capital-growth play &mdash; not an income play</div>
</div></div>

</body></html>
