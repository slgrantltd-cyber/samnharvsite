<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital@1&family=Fragment+Mono&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ivory: #f5f2eb;
    --ink: #1a1a1a;
    --stone: #5c5952;
    --bronze: #8c7b65;
    --line: rgba(26,26,26,0.14);
  }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    background-color: var(--ivory);
    color: var(--ink);
    position: relative;
    font-family: "Libre Caslon Display", Georgia, serif;
  }
  .marble, .sheen, .grain { position: absolute; inset: 0; }
  .marble svg { width: 100%; height: 100%; display: block; }
  /* polished gloss: two sharp specular bands + daylight + corner depth */
  .sheen {
    background:
      linear-gradient(112deg,
        rgba(255,253,247,0) 26%,
        rgba(255,253,247,0.78) 39%,
        rgba(255,253,247,0.16) 46%,
        rgba(255,253,247,0) 54%),
      linear-gradient(112deg,
        rgba(255,253,247,0) 60%,
        rgba(255,253,247,0.5) 68%,
        rgba(255,253,247,0) 75%),
      radial-gradient(130% 120% at 18% -10%, rgba(255,253,247,0.6), rgba(255,253,247,0) 58%),
      radial-gradient(130% 170% at 106% 125%, rgba(31,30,28,0.15), rgba(31,30,28,0) 55%),
      radial-gradient(120% 150% at -8% 120%, rgba(31,30,28,0.08), rgba(31,30,28,0) 45%);
  }
  .grain {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch' seed='7'/><feColorMatrix type='matrix' values='0 0 0 0 0.10 0 0 0 0 0.09 0 0 0 0 0.08 0 0 0 0.035 0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
  }
  /* ghost benchmark moves LEFT — the avatar zone may cover it, text stays clear */
  .ghost {
    position: absolute;
    left: 96px; top: 50%;
    transform: translateY(-46%);
    width: 340px; height: 340px;
    color: rgba(26,26,26,0.07);
  }
  .ghost svg { width: 100%; height: 100%; }
  .datum {
    position: absolute;
    left: 0; right: 0; top: 122px;
    height: 1px;
    background: rgba(26,26,26,0.06);
  }
  /* text right-aligned, clear of the bottom-left profile-photo overlay */
  .content {
    position: absolute;
    right: 92px; top: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    text-align: right;
  }
  .wordmark { display: flex; align-items: center; gap: 18px; }
  .mark { width: 34px; height: 34px; color: var(--bronze); }
  .wordmark span { font-size: 30px; letter-spacing: 0.06em; }
  .wordmark i {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-style: italic;
    color: var(--bronze);
  }
  h1 {
    margin-top: 26px;
    font-weight: 400;
    font-size: 76px;
    line-height: 0.98;
    letter-spacing: -0.02em;
  }
  h1 i { font-family: "Libre Caslon Text", Georgia, serif; font-style: italic; }
  .annot {
    margin-top: 30px;
    font-family: "Fragment Mono", monospace;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--stone);
  }
  .rule {
    position: absolute;
    left: 560px; right: 92px; bottom: 40px;
    height: 9px;
    border-bottom: 1px solid var(--line);
    background-image: repeating-linear-gradient(
      to right,
      rgba(26,26,26,0.15) 0 1px,
      transparent 1px 60px
    );
  }
  .rule::after {
    content: "";
    position: absolute;
    right: 0; bottom: -2px;
    width: 61px; height: 3px;
    background: var(--bronze);
  }
</style>
</head>
<body>
  <div class="marble">
    <svg viewBox="0 0 1584 396" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="vein" x="-20%" y="-40%" width="140%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.012" numOctaves="4" seed="14" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="130" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="cloud">
          <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.006" numOctaves="3" seed="4"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.58  0 0 0 0 0.51  0 0 0 0.10 0"/>
        </filter>
        <filter id="cloud2">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.016" numOctaves="3" seed="27"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.83  0 0 0 0 0.77  0 0 0 0.14 0"/>
        </filter>
      </defs>
      <rect width="1584" height="396" filter="url(#cloud)"/>
      <rect width="1584" height="396" filter="url(#cloud2)"/>
      <g filter="url(#vein)" fill="none" stroke-linecap="round">
        <path d="M -60 320 C 300 260 520 340 820 250 C 1120 160 1350 240 1660 150" stroke="rgba(125,116,102,0.38)" stroke-width="2.2"/>
        <path d="M -60 300 C 340 260 560 330 880 240 C 1180 160 1380 230 1660 140" stroke="rgba(163,154,138,0.24)" stroke-width="1"/>
        <path d="M -80 90 C 260 140 620 40 960 110 C 1240 165 1440 90 1660 130" stroke="rgba(140,131,116,0.3)" stroke-width="1.6"/>
        <path d="M 200 -40 C 340 120 280 260 420 440" stroke="rgba(150,141,125,0.22)" stroke-width="1.2"/>
        <path d="M 1050 -60 C 1150 120 1080 260 1220 460" stroke="rgba(125,116,102,0.26)" stroke-width="1.5"/>
        <path d="M -60 200 C 400 190 700 230 1000 180 C 1280 135 1480 190 1660 170" stroke="rgba(168,148,120,0.22)" stroke-width="1.3"/>
        <path d="M 620 -50 C 700 90 640 220 760 450" stroke="rgba(163,154,138,0.18)" stroke-width="1"/>
        <path d="M 1420 -40 C 1470 120 1400 250 1500 440" stroke="rgba(140,131,116,0.2)" stroke-width="1"/>
      </g>
    </svg>
  </div>
  <div class="sheen"></div>
  <div class="grain"></div>
  <div class="datum"></div>
  <div class="ghost">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="square">
      <line x1="4" y1="7" x2="28" y2="7"/>
      <line x1="16" y1="7" x2="16" y2="14"/>
      <path d="M16 14 L7 27 M16 14 L25 27 M16 14 L16 27"/>
    </svg>
  </div>
  <div class="content">
    <div class="wordmark">
      <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square">
        <line x1="4" y1="7" x2="28" y2="7"/>
        <line x1="16" y1="7" x2="16" y2="14"/>
        <path d="M16 14 L7 27 M16 14 L25 27 M16 14 L16 27"/>
      </svg>
      <span>SAM <i>n</i> HARV</span>
    </div>
    <h1>Our names are on <i>everything.</i></h1>
    <p class="annot">TWO BROTHERS — PROPERTY INVESTMENT &amp; DEAL SOURCING — UK SOUTH WEST</p>
  </div>
  <div class="rule"></div>
</body>
</html>
